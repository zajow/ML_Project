<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thai Loan Prediction</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Thai Loan Prediction</h1>
    <form id="loanForm">
      <label for="age">Age</label>
      <input type="number" id="age" name="age" min="18" max="80" required>

      <label for="income">Monthly Income (THB)</label>
      <input type="number" id="income" name="income" min="0" max="500000" step="1" required>

      <label for="loanAmount">Loan Amount (THB)</label>
      <input type="number" id="loanAmount" name="loanAmount" min="0" max="10000000" step="1" required>

      <label for="creditScore">Credit Score</label>
      <input type="number" id="creditScore" name="creditScore" min="300" max="850" required>

      <label for="interestRate">Interest Rate (%)</label>
      <input type="number" step="0.01" id="interestRate" name="interestRate" min="0" max="50" required>

      <label for="loanTerm">Loan Term (Years)</label>
      <input type="number" id="loanTerm" name="loanTerm" min="1" max="30" required>

      <label for="mortgage">Has Mortgage?</label>
      <select id="mortgage" name="mortgage" required>
        <option value="yes">Yes</option>
        <option value="no">No</option>
      </select>

      <label for="employment">Employment Status</label>
      <select id="employment" name="employment" required>
        <option value="fulltime">Full-time</option>
        <option value="parttime">Part-time</option>
        <option value="selfemployed">Self-employed</option>
        <option value="unemployed">Unemployed</option>
      </select>

      <button type="submit">Predict</button>
    </form>
    <div id="result"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
